remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: "dirt"

locale: "en-US"
title: "Neal Ryan Barshes, MD, MPH"
title_separator: "-"
subtitle: "vascular surgeon"
name: "Neal Ryan Barshes, MD, MPH"
description: "Vascular surgeon focused on limb preservation, outcomes research, education, and health systems improvement."
logo: "/assets/images/brand/footgoldonlynooutline.png"
og_image: "/assets/images/home/feetforgithub2.jpg"

url: "https://nealbarshes.github.io"
baseurl: ""
repository: "nealbarshes/nealbarshes.github.io"

search: true

after_footer_scripts:
  - /assets/js/site-navigation.js
  - /assets/js/tutorial-navigation.js?v=20260817-2

plugins:
  - jekyll-feed
  - jekyll-include-cache

markdown: kramdown
kramdown:
  input: GFM

include:
  - _pages

exclude:
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - README.md
  - assets/README.md
  - assets/documents/articles/README.md
  - node_modules
  - vendor

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-YPLVGC5FDP"
    anonymize_ip: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
  - scope:
      path: "tutorials"
      type: "pages"
    values:
      classes:
        - tutorial-tech
      breadcrumbs: true
